<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h1>Elemento merter</h1>
<p>Define una medición escalar dentro de un rango conocido:</p>
<label for="disk_c">Uso de disco C:</label>
<meter id="disk_c" value="2" min="0" max="10">2 de 10</meter><br>
<label for="disk_d">Uso de disco D:</label>
<meter id="disk_d" value="0.6">60%</meter>

<h1>The progress element</h1>
<label for="file">Downloading progress File1:</label>
<progress id="file" value="32"  min="0" max="100"> 32% </progress><br>
<label for="file2">Downloading progress File2:</label>
<progress id="file2" value="0.6"> 32% </progress>
</body>
</html>
