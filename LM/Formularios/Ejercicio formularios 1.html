<!DOCTYPE html>
<html lang="en"><body>
<h1>Montes</h1>
<p>Introduzca la información de un monte:</p>
<form action="formulario3_3.html" method="get">
    <label for="monte">Nombre</label>
    <input type="text" id="monte" name="nombre"><br>
    <label for="alt">Altura</label>

    </select><br>
    <input type="submit" value="Enviar">
</form>
</body>
</html>
